<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatch HUD v2</title>
<style>
:root {
  --bg: #0a0a0a;
  --bg-panel: #141414;
  --bg-card: #1a1a1a;
  --border: #2a2a2a;
  --text: #e0e0e0;
  --text-dim: #888;
  --text-faint: #555;
  --green: #22c55e;
  --cyan: #22d3ee;
  --amber: #f59e0b;
  --red: #ef4444;
  --purple: #b17bff;
  --blue: #3b82f6;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.4; }

/* layout */
.app { display: flex; flex-direction: column; height: 100vh; }
.header { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; background: var(--bg-panel); border-bottom: 1px solid var(--border); }
.header h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.5px; }
.header .meta { display: flex; gap: 16px; align-items: center; font-size: 12px; color: var(--text-dim); }
.body { display: flex; flex: 1; overflow: hidden; }
.main { flex: 1; overflow-y: auto; padding: 12px; }
.sidebar { width: 320px; border-left: 1px solid var(--border); overflow-y: auto; padding: 12px; background: var(--bg-panel); }

/* status indicators */
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.dot.active { background: var(--green); box-shadow: 0 0 6px var(--green); }
.dot.recent { background: var(--cyan); }
.dot.completed { background: var(--text-faint); }
.dot.idle { background: var(--text-faint); }
.dot.unknown { background: var(--amber); }
.conn { display: flex; align-items: center; gap: 4px; }
.conn.ok { color: var(--green); }
.conn.off { color: var(--red); }
.conn.recon { color: var(--amber); }

/* task cards */
.section { margin-bottom: 20px; }
.section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
.task-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 8px; }
.task-card.active { border-color: var(--green); box-shadow: 0 0 0 1px rgba(34,197,94,0.2); }
.task-card.recent { border-color: var(--cyan); }
.task-card .task-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.task-card .task-agent { font-weight: 600; font-size: 13px; }
.task-card .task-status { font-size: 11px; font-weight: 600; text-transform: uppercase; }
.task-card .task-status.active { color: var(--green); }
.task-card .task-status.recent { color: var(--cyan); }
.task-card .task-desc { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; word-wrap: break-word; }
.task-card .task-meta { display: flex; gap: 12px; font-size: 11px; color: var(--text-faint); font-family: var(--mono); }
.task-card .task-meta span { white-space: nowrap; }

/* ambient cards */
.ambient-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
.ambient-card .ambient-key { font-family: var(--mono); color: var(--text-dim); }
.ambient-card .ambient-meta { display: flex; gap: 8px; font-family: var(--mono); color: var(--text-faint); font-size: 11px; }

/* fleet list */
.fleet-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border-radius: 4px; margin-bottom: 2px; }
.fleet-item:hover { background: var(--bg-card); }
.fleet-item .fleet-name { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.fleet-item .fleet-meta { display: flex; gap: 8px; font-size: 11px; color: var(--text-faint); font-family: var(--mono); }

/* comms feed */
.comm-item { padding: 6px 8px; border-radius: 4px; margin-bottom: 2px; font-size: 12px; }
.comm-item .comm-from { color: var(--amber); font-weight: 600; }
.comm-item .comm-to { color: var(--cyan); font-weight: 600; }
.comm-item .comm-time { color: var(--text-faint); font-size: 11px; }

/* session list */
.session-item { padding: 6px 8px; border-radius: 4px; margin-bottom: 2px; font-size: 12px; display: flex; justify-content: space-between; }
.session-item:hover { background: var(--bg-card); }
.session-item .sess-key { font-family: var(--mono); color: var(--text-dim); font-size: 11px; word-break: break-all; }
.session-item .sess-meta { display: flex; gap: 8px; font-family: var(--mono); color: var(--text-faint); font-size: 11px; white-space: nowrap; }

/* collapsible */
.collapsible-toggle { cursor: pointer; user-select: none; }
.collapsible-toggle::after { content: ' ▾'; color: var(--text-faint); }
.collapsible-toggle.collapsed::after { content: ' ▸'; color: var(--text-faint); }
.collapsible.collapsed { display: none; }

/* offline overlay */
.offline-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 100; }
.offline-overlay .offline-box { text-align: center; }
.offline-overlay h2 { color: var(--red); margin-bottom: 8px; }
.offline-overlay p { color: var(--text-dim); }
.offline-overlay code { background: var(--bg-card); padding: 4px 8px; border-radius: 4px; font-family: var(--mono); color: var(--green); }

/* empty state */
.empty { color: var(--text-faint); font-style: italic; padding: 8px; font-size: 12px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>DISPATCH HUD v2</h1>
    <div class="meta">
      <span id="counts">0 sessions | 0 agents</span>
      <span id="version"></span>
      <span id="conn" class="conn recon">CONNECTING</span>
    </div>
  </div>
  <div class="body">
    <div class="main" id="main-panel">
      <div class="section">
        <div class="section-title">Active Work <span id="work-count"></span></div>
        <div id="active-work"><div class="empty">No active work</div></div>
      </div>
      <div class="section">
        <div class="section-title collapsible-toggle collapsed" id="sessions-toggle">All Sessions</div>
        <div id="sessions" class="collapsible collapsed"></div>
      </div>
    </div>
    <div class="sidebar">
      <div class="section">
        <div class="section-title">Fleet</div>
        <div id="fleet"></div>
      </div>
      <div class="section">
        <div class="section-title">Comms Feed</div>
        <div id="comms"><div class="empty">No comms</div></div>
      </div>
    </div>
  </div>
</div>
<div id="offline" class="offline-overlay" style="display:none">
  <div class="offline-box">
    <h2>GATEWAY OFFLINE</h2>
    <p>Restart with: <code>openclaw gateway restart</code></p>
  </div>
</div>

<script>
var es = null;
var reconnectTimer = null;

function connect() {
  var conn = document.getElementById('conn');
  conn.className = 'conn recon';
  conn.textContent = 'CONNECTING';

  es = new EventSource('/stream');

  es.addEventListener('state', function(e) {
    var data = JSON.parse(e.data);
    render(data);
    document.getElementById('offline').style.display = 'none';
    conn.className = 'conn ok';
    conn.textContent = 'LIVE';
  });

  es.addEventListener('gateway-offline', function(e) {
    document.getElementById('offline').style.display = 'flex';
    conn.className = 'conn off';
    conn.textContent = 'OFFLINE';
  });

  es.addEventListener('version', function(e) {
    var data = JSON.parse(e.data);
    document.getElementById('version').textContent = data.version ? 'v' + data.version : '';
  });

  es.addEventListener('format-error', function(e) {
    var data = JSON.parse(e.data);
    console.warn('Format error:', data.message);
  });

  es.onopen = function() {
    conn.className = 'conn ok';
    conn.textContent = 'LIVE';
  };

  es.onerror = function() {
    conn.className = 'conn recon';
    conn.textContent = 'RECONNECTING';
    es.close();
    if (!reconnectTimer) {
      reconnectTimer = setTimeout(function() {
        reconnectTimer = null;
        connect();
      }, 5000);
    }
  };
}

function fmtTokens(n) {
  if (!n || n < 0) return '-';
  if (n < 1000) return n + '';
  if (n < 1000000) return (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'k';
  return (n / 1000000).toFixed(1) + 'M';
}

function ago(ms) {
  if (!ms) return 'never';
  var s = Math.floor((Date.now() - ms) / 1000);
  if (s < 0) return 'now';
  if (s < 60) return s + 's ago';
  var m = Math.floor(s / 60);
  if (m < 60) return m + 'm ago';
  var h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  return Math.floor(h / 24) + 'd ago';
}

function render(data) {
  // Counts
  var c = data.counts || {};
  document.getElementById('counts').textContent =
    (c.totalSessions || 0) + ' sessions | ' +
    (c.agents || 0) + ' agents | ' +
    (c.activeWork || 0) + ' active';
  document.getElementById('work-count').textContent = c.activeWork ? ' (' + c.activeWork + ')' : '';

  // Active Work (unified panel)
  var workEl = document.getElementById('active-work');
  var work = data.activeWork || [];
  if (work.length === 0) {
    workEl.innerHTML = '<div class="empty">No active work</div>';
  } else {
    workEl.innerHTML = work.map(function(w) {
      var cls = w.status === 'active' ? 'active' : 'recent';
      var icon = w.isSubagent ? '🤖' : (w.kind === 'cron' ? '⏰' : (w.kind === 'telegram' ? '💬' : '📡'));
      return '<div class="task-card ' + cls + '">' +
        '<div class="task-header">' +
          '<span class="task-agent">' + icon + ' ' + escapeHtml(w.agentId || 'main') + '</span>' +
          '<span class="task-status ' + cls + '">' + w.status + '</span>' +
        '</div>' +
        '<div class="task-desc">' + escapeHtml(w.taskDesc) + '</div>' +
        '<div class="task-meta">' +
          '<span>' + fmtTokens(w.tokens) + ' tok</span>' +
          '<span>' + (w.model || '') + '</span>' +
          '<span>' + (w.elapsed || '') + '</span>' +
          '<span>' + ago(w.updatedAt) + '</span>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  // Fleet
  var fleetEl = document.getElementById('fleet');
  var fleet = data.agents || [];
  fleetEl.innerHTML = fleet.map(function(a) {
    return '<div class="fleet-item">' +
      '<span class="fleet-name">' +
        '<span class="dot ' + a.status + '"></span>' +
        (a.emoji || '') + ' ' + escapeHtml(a.name) +
      '</span>' +
      '<span class="fleet-meta">' +
        '<span>' + (a.lastActiveAgo || 'never') + '</span>' +
        '<span>' + fmtTokens(a.tokens) + '</span>' +
      '</span>' +
    '</div>';
  }).join('');

  // Comms
  var commsEl = document.getElementById('comms');
  var comms = data.comms || [];
  if (comms.length === 0) {
    commsEl.innerHTML = '<div class="empty">No comms</div>';
  } else {
    commsEl.innerHTML = comms.map(function(c) {
      return '<div class="comm-item">' +
        '<span class="comm-from">' + escapeHtml(c.from) + '</span> → ' +
        '<span class="comm-to">' + escapeHtml(c.to) + '</span> ' +
        '<span class="comm-time">' + (c.ago || '') + '</span>' +
      '</div>';
    }).join('');
  }

  // Sessions (collapsible)
  var sessEl = document.getElementById('sessions');
  var sess = data.sessions || [];
  sessEl.innerHTML = sess.slice(0, 50).map(function(s) {
    return '<div class="session-item">' +
      '<span class="sess-key">' + escapeHtml(s.key || '') + '</span>' +
      '<span class="sess-meta">' +
        '<span>' + fmtTokens(s.tokens) + '</span>' +
        '<span>' + (s.ageAgo || '') + '</span>' +
        '<span class="dot ' + s.status + '"></span>' +
      '</span>' +
    '</div>';
  }).join('');
}

function escapeHtml(text) {
  if (!text) return '';
  var div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// Collapsible toggle
document.getElementById('sessions-toggle').addEventListener('click', function() {
  this.classList.toggle('collapsed');
  document.getElementById('sessions').classList.toggle('collapsed');
});

// Start
connect();
</script>
</body>
</html>
