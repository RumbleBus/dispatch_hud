<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatch HUD</title>
<style>
:root {
  --bg: #0a0a0a;
  --bg-panel: #141414;
  --bg-card: #1a1a1a;
  --bg-card-hover: #222;
  --border: #2a2a2a;
  --border-light: #3a3a3a;
  --text: #e0e0e0;
  --text-dim: #888;
  --text-faint: #555;
  --gold: #ffb733;
  --gold-glow: rgba(255,183,51,0.3);
  --purple: #9b6dff;
  --purple-glow: rgba(155,109,255,0.2);
  --teal: #2dd4bf;
  --teal-glow: rgba(45,212,191,0.15);
  --orange: #ff6b4a;
  --orange-glow: rgba(255,107,74,0.2);
  --cyan: #22d3ee;
  --amber: #f59e0b;
  --red: #ef4444;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.4; overflow: hidden; }

/* layout */
.app { display: flex; flex-direction: column; height: 100vh; }
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 16px; background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.header-left { display: flex; align-items: center; gap: 16px; }
.header h1 { font-size: 14px; font-weight: 600; letter-spacing: 1px; }
.header-right { display: flex; gap: 20px; align-items: center; font-size: 12px; color: var(--text-dim); }
.daily-tokens {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 12px; border-radius: 4px;
  background: var(--bg-card); border: 1px solid var(--border);
  font-family: var(--mono); font-size: 12px;
}
.daily-tokens .label { color: var(--text-faint); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
.daily-tokens .value { color: var(--gold); font-weight: 600; }

.body { display: flex; flex: 1; overflow: hidden; }
.main { flex: 1; overflow-y: auto; padding: 16px; }
.sidebar { width: 320px; border-left: 1px solid var(--border); overflow-y: auto; padding: 12px; background: var(--bg-panel); flex-shrink: 0; }

/* connection */
.conn { display: flex; align-items: center; gap: 4px; }
.conn.ok { color: var(--teal); }
.conn.off { color: var(--red); }
.conn.recon { color: var(--amber); }

/* fleet view */
.fleet-container { max-width: 1200px; }
.category-section { margin-bottom: 24px; }
.category-header {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 12px; padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.category-label {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 1.5px; color: var(--text-dim);
}
.category-count { font-size: 11px; color: var(--text-faint); }

.agent-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }

.agent-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 8px; padding: 14px; display: flex;
  flex-direction: column; align-items: center; gap: 8px;
  transition: background 0.2s, border-color 0.3s;
  position: relative; overflow: hidden;
}
.agent-card:hover { background: var(--bg-card-hover); }

/* status-colored left border */
.agent-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; transition: background 0.3s;
}
.agent-card.active::before { background: var(--gold); box-shadow: 0 0 8px var(--gold-glow); }
.agent-card.recent::before { background: var(--purple); }
.agent-card.idle::before { background: var(--teal); opacity: 0.4; }
.agent-card.stale::before { background: var(--orange); }

/* agent card glow for active */
.agent-card.active {
  border-color: var(--gold);
  box-shadow: 0 0 0 1px var(--gold-glow), 0 0 20px var(--gold-glow);
}
.agent-card.stale {
  border-color: var(--orange);
  opacity: 0.85;
}

/* icon circle */
.agent-icon {
  width: 48px; height: 48px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--border-light);
  transition: border-color 0.3s, box-shadow 0.3s;
  flex-shrink: 0;
}
.agent-card.active .agent-icon { border-color: var(--gold); box-shadow: 0 0 12px var(--gold-glow); }
.agent-card.recent .agent-icon { border-color: var(--purple); }
.agent-card.idle .agent-icon { border-color: var(--teal); opacity: 0.5; }
.agent-card.stale .agent-icon { border-color: var(--orange); }

.agent-icon svg { width: 24px; height: 24px; stroke: var(--text-dim); fill: none; stroke-width: 1.5; transition: stroke 0.3s; }
.agent-card.active .agent-icon svg { stroke: var(--gold); }
.agent-card.recent .agent-icon svg { stroke: var(--purple); }
.agent-card.idle .agent-icon svg { stroke: var(--teal); }
.agent-card.stale .agent-icon svg { stroke: var(--orange); }

.agent-name { font-size: 13px; font-weight: 600; text-align: center; }
.agent-status {
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.5px;
}
.agent-card.active .agent-status { color: var(--gold); }
.agent-card.recent .agent-status { color: var(--purple); }
.agent-card.idle .agent-status { color: var(--teal); opacity: 0.6; }
.agent-card.stale .agent-status { color: var(--orange); }

.agent-meta {
  display: flex; gap: 10px; font-size: 10px;
  font-family: var(--mono); color: var(--text-faint);
}
.agent-meta span { white-space: nowrap; }

/* empty category */
.category-empty {
  color: var(--text-faint); font-style: italic;
  font-size: 12px; padding: 8px 0;
}

/* sidebar sections */
.section { margin-bottom: 20px; }
.section-title {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 1px; color: var(--text-dim); margin-bottom: 8px;
  padding-bottom: 4px; border-bottom: 1px solid var(--border);
}

/* task cards */
.task-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 6px; padding: 12px; margin-bottom: 8px;
}
.task-card.active { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold-glow); }
.task-card.recent { border-color: var(--purple); }
.task-card .task-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.task-card .task-agent { font-weight: 600; font-size: 13px; }
.task-card .task-status { font-size: 11px; font-weight: 600; text-transform: uppercase; }
.task-card .task-status.active { color: var(--gold); }
.task-card .task-status.recent { color: var(--purple); }
.task-card .task-desc { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; word-wrap: break-word; }
.task-card .task-meta { display: flex; gap: 12px; font-size: 11px; color: var(--text-faint); font-family: var(--mono); }
.task-card .task-meta span { white-space: nowrap; }

/* comms feed */
.comm-item { padding: 6px 8px; border-radius: 4px; margin-bottom: 2px; font-size: 12px; }
.comm-item .comm-from { color: var(--amber); font-weight: 600; }
.comm-item .comm-to { color: var(--cyan); font-weight: 600; }
.comm-item .comm-time { color: var(--text-faint); font-size: 11px; }

/* session list */
.session-item { padding: 6px 8px; border-radius: 4px; margin-bottom: 2px; font-size: 12px; display: flex; justify-content: space-between; }
.session-item:hover { background: var(--bg-card); }
.session-item .sess-key { font-family: var(--mono); color: var(--text-dim); font-size: 11px; word-break: break-all; }
.session-item .sess-meta { display: flex; gap: 8px; font-family: var(--mono); color: var(--text-faint); font-size: 11px; white-space: nowrap; }

/* collapsible */
.collapsible-toggle { cursor: pointer; user-select: none; }
.collapsible-toggle::after { content: ' \u25BE'; color: var(--text-faint); }
.collapsible-toggle.collapsed::after { content: ' \u25B8'; color: var(--text-faint); }
.collapsible.collapsed { display: none; }

/* status dots (for sessions) */
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.dot.active { background: var(--gold); box-shadow: 0 0 6px var(--gold-glow); }
.dot.recent { background: var(--purple); }
.dot.completed { background: var(--text-faint); }
.dot.idle { background: var(--teal); opacity: 0.4; }
.dot.stale { background: var(--orange); }
.dot.unknown { background: var(--amber); }

/* offline overlay */
.offline-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 100; }
.offline-overlay .offline-box { text-align: center; }
.offline-overlay h2 { color: var(--red); margin-bottom: 8px; }
.offline-overlay p { color: var(--text-dim); }
.offline-overlay code { background: var(--bg-card); padding: 4px 8px; border-radius: 4px; font-family: var(--mono); color: var(--teal); }

/* empty state */
.empty { color: var(--text-faint); font-style: italic; padding: 8px; font-size: 12px; }

/* scrollbars */
.main::-webkit-scrollbar, .sidebar::-webkit-scrollbar { width: 6px; }
.main::-webkit-scrollbar-thumb, .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.main::-webkit-scrollbar-track, .sidebar::-webkit-scrollbar-track { background: transparent; }

/* responsive: stack sidebar on narrow screens */
@media (max-width: 900px) {
  .body { flex-direction: column; }
  .sidebar { width: 100%; border-left: none; border-top: 1px solid var(--border); max-height: 40vh; }
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-left">
      <h1>DISPATCH HUD</h1>
    </div>
    <div class="header-right">
      <div class="daily-tokens">
        <span class="label">Today</span>
        <span class="value" id="daily-tokens">0</span>
      </div>
      <span id="counts">0 sessions | 0 agents</span>
      <span id="version"></span>
      <span id="conn" class="conn recon">CONNECTING</span>
    </div>
  </div>
  <div class="body">
    <div class="main" id="main-panel">
      <div class="fleet-container" id="fleet-container"></div>
      <div class="section">
        <div class="section-title collapsible-toggle collapsed" id="sessions-toggle">All Sessions</div>
        <div id="sessions" class="collapsible collapsed"></div>
      </div>
    </div>
    <div class="sidebar">
      <div class="section">
        <div class="section-title">Active Work <span id="work-count"></span></div>
        <div id="active-work"><div class="empty">No active work</div></div>
      </div>
      <div class="section">
        <div class="section-title">Comms Feed</div>
        <div id="comms"><div class="empty">No comms</div></div>
      </div>
    </div>
  </div>
</div>
<div id="offline" class="offline-overlay" style="display:none">
  <div class="offline-box">
    <h2>GATEWAY OFFLINE</h2>
    <p>Restart with: <code>openclaw gateway restart</code></p>
  </div>
</div>

<!-- SVG icon definitions -->

<script>
var es = null;
var reconnectTimer = null;

// Agent icon mapping
var AGENT_ICONS = {
  'main': 'icon-headset',
  'dev-lead': 'icon-code',
  'devops': 'icon-gear',
  'writer': 'icon-quill',
  'art-director': 'icon-palette',
  'tax-assistant': 'icon-document',
  'security-reviewer': 'icon-shield',
  'editor': 'icon-pencil',
  'creative-reviewer': 'icon-eye',
  'tax-reviewer': 'icon-check-doc',
  'philosopher': 'icon-bust',
  'ux-researcher': 'icon-compass',
  'pm-impact-analyst': 'icon-chart',
};

// Category display order and labels
var CATEGORY_ORDER = ['orchestrator', 'planners', 'producers', 'critics', 'researchers'];
var CATEGORY_LABELS = {
  orchestrator: 'Orchestrator',
  planners: 'Planners',
  producers: 'Producers',
  critics: 'Critics',
  researchers: 'Researchers',
};

function connect() {
  var conn = document.getElementById('conn');
  conn.className = 'conn recon';
  conn.textContent = 'CONNECTING';
  es = new EventSource('/stream');

  es.addEventListener('state', function(e) {
    var data = JSON.parse(e.data);
    render(data);
    document.getElementById('offline').style.display = 'none';
    conn.className = 'conn ok';
    conn.textContent = 'LIVE';
  });

  es.addEventListener('gateway-offline', function(e) {
    document.getElementById('offline').style.display = 'flex';
    conn.className = 'conn off';
    conn.textContent = 'OFFLINE';
  });

  es.addEventListener('version', function(e) {
    var data = JSON.parse(e.data);
    document.getElementById('version').textContent = data.version ? 'v' + data.version : '';
  });

  es.addEventListener('format-error', function(e) {
    var data = JSON.parse(e.data);
    console.warn('Format error:', data.message);
  });

  es.onopen = function() {
    conn.className = 'conn ok';
    conn.textContent = 'LIVE';
  };

  es.onerror = function() {
    conn.className = 'conn recon';
    conn.textContent = 'RECONNECTING';
    es.close();
    if (!reconnectTimer) {
      reconnectTimer = setTimeout(function() {
        reconnectTimer = null;
        connect();
      }, 5000);
    }
  };
}

function fmtTokens(n) {
  if (!n || n < 0) return '-';
  if (n < 1000) return n + '';
  if (n < 1000000) return (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'k';
  return (n / 1000000).toFixed(1) + 'M';
}

function ago(ms) {
  if (!ms) return 'never';
  var s = Math.floor((Date.now() - ms) / 1000);
  if (s < 0) return 'now';
  if (s < 60) return s + 's ago';
  var m = Math.floor(s / 60);
  if (m < 60) return m + 'm ago';
  var h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  return Math.floor(h / 24) + 'd ago';
}

function render(data) {
  // Counts
  var c = data.counts || {};
  document.getElementById('counts').textContent =
    (c.totalSessions || 0) + ' sessions | ' +
    (c.agents || 0) + ' agents | ' +
    (c.activeWork || 0) + ' active';
  document.getElementById('work-count').textContent = c.activeWork ? ' (' + c.activeWork + ')' : '';

  // Daily tokens (Perth calendar day)
  document.getElementById('daily-tokens').textContent = fmtTokens(data.dailyTokens || 0) + ' tok';

  // Fleet view — grouped by category
  renderFleet(data.agents || []);

  // Active Work
  var workEl = document.getElementById('active-work');
  var work = data.activeWork || [];
  if (work.length === 0) {
    workEl.innerHTML = '<div class="empty">No active work</div>';
  } else {
    workEl.innerHTML = work.map(function(w) {
      var cls = w.status === 'active' ? 'active' : 'recent';
      var icon = w.isSubagent ? '\u{1F916}' : (w.kind === 'cron' ? '\u23F0' : (w.kind === 'telegram' ? '\u{1F4AC}' : '\u{1F4E1}');
      return '<div class="task-card ' + cls + '">' +
        '<div class="task-header">' +
          '<span class="task-agent">' + icon + ' ' + escapeHtml(w.agentId || 'main') + '</span>' +
          '<span class="task-status ' + cls + '">' + w.status + '</span>' +
        '</div>' +
        '<div class="task-desc">' + escapeHtml(w.taskDesc) + '</div>' +
        '<div class="task-meta">' +
          '<span>' + fmtTokens(w.tokens) + ' tok</span>' +
          '<span>' + (w.model || '') + '</span>' +
          '<span>' + (w.elapsed || '') + '</span>' +
          '<span>' + ago(w.updatedAt) + '</span>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  // Comms
  var commsEl = document.getElementById('comms');
  var comms = data.comms || [];
  if (comms.length === 0) {
    commsEl.innerHTML = '<div class="empty">No comms</div>';
  } else {
    commsEl.innerHTML = comms.map(function(c) {
      return '<div class="comm-item">' +
        '<span class="comm-from">' + escapeHtml(c.from) + '</span> \u2192 ' +
        '<span class="comm-to">' + escapeHtml(c.to) + '</span> ' +
        '<span class="comm-time">' + (c.ago || '') + '</span>' +
      '</div>';
    }).join('');
  }

  // Sessions (collapsible)
  var sessEl = document.getElementById('sessions');
  var sess = data.sessions || [];
  sessEl.innerHTML = sess.slice(0, 50).map(function(s) {
    return '<div class="session-item">' +
      '<span class="sess-key">' + escapeHtml(s.key || '') + '</span>' +
      '<span class="sess-meta">' +
        '<span>' + fmtTokens(s.tokens) + '</span>' +
        '<span>' + (s.ageAgo || '') + '</span>' +
        '<span class="dot ' + s.status + '"></span>' +
      '</span>' +
    '</div>';
  }).join('');
}

function renderFleet(fleet) {
  var container = document.getElementById('fleet-container');
  var byCategory = {};
  CATEGORY_ORDER.forEach(function(cat) { byCategory[cat] = []; });
  fleet.forEach(function(a) {
    var cat = a.category || 'producers';
    if (!byCategory[cat]) byCategory[cat] = [];
    byCategory[cat].push(a);
  });

  var html = '';
  CATEGORY_ORDER.forEach(function(cat) {
    var agents = byCategory[cat] || [];
    var label = CATEGORY_LABELS[cat] || cat;
    html += '<div class="category-section">';
    html += '<div class="category-header">' +
      '<span class="category-label">' + label + '</span>' +
      '<span class="category-count">' + agents.length + '</span>' +
    '</div>';

    if (agents.length === 0) {
      html += '<div class="category-empty">No agents configured</div>';
    } else {
      html += '<div class="agent-grid">';
      agents.forEach(function(a) {
        var iconId = AGENT_ICONS[a.id] || 'icon-headset';
        html += '<div class="agent-card ' + (a.status || 'idle') + '">' +
          '<div class="agent-icon">' +
            '<svg><use href="#' + iconId + '"/></svg>' +
          '</div>' +
          '<div class="agent-name">' + escapeHtml(a.identityName || a.name) + '</div>' +
          '<div class="agent-status">' + (a.status || 'idle') + '</div>' +
          '<div class="agent-meta">' +
            '<span>' + a.sessions + ' sess</span>' +
            '<span>' + fmtTokens(a.tokens) + '</span>' +
            '<span>' + (a.lastActiveAgo || 'never') + '</span>' +
          '</div>' +
        '</div>';
      });
      html += '</div>';
    }
    html += '</div>';
  });

  container.innerHTML = html;
}

function escapeHtml(text) {
  if (!text) return '';
  var div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// Collapsible toggle
document.getElementById('sessions-toggle').addEventListener('click', function() {
  this.classList.toggle('collapsed');
  document.getElementById('sessions').classList.toggle('collapsed');
});

// Start
connect();
</script>
