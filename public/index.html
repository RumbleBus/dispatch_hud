<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DISPATCH HUD</title>
<style>
:root{--bg:#03080d;--bp:#050b12;--bp2:#0a1219;--cy:#22d3ee;--cyh:#00e5ff;--gd:#f5b301;--gdh:#ffb000;--tx:#cfe9f2;--dm:#5b7a8a;--gn:#2fd67b;--gnh:#46f0a0;--re:#ff5d5d;--vi:#b17bff;--vih:#c9a0ff;--c03:rgba(34,211,238,0.03);--c06:rgba(34,211,238,0.06);--c10:rgba(34,211,238,0.10);--c16:rgba(34,211,238,0.16);--c25:rgba(34,211,238,0.25);--c45:rgba(34,211,238,0.45);--c70:rgba(34,211,238,0.70);--g10:rgba(245,179,1,0.10);--g45:rgba(245,179,1,0.45);--gr12:rgba(47,214,123,0.12);--gr40:rgba(47,214,123,0.40);--r12:rgba(255,93,93,0.12);--r45:rgba(255,93,93,0.45);--v06:rgba(177,123,255,0.06);--v12:rgba(177,123,255,0.12);--v25:rgba(177,123,255,0.25);--ed:1px solid var(--c25);--fn:'IBM Plex Mono','SF Mono','Cascadia Code','JetBrains Mono',Consolas,monospace;--xs:.625rem;--sm:.72rem;--tr:.14em;--trw:.28em;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--r:3px;--b:12px;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow:hidden}
body{font-family:var(--fn);font-size:var(--xs);color:var(--tx);background:var(--bg);display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(1100px 700px at 50% 12%,var(--c06),transparent 65%),repeating-linear-gradient(0deg,var(--c03) 0 1px,transparent 1px 88px),repeating-linear-gradient(90deg,var(--c03) 0 1px,transparent 1px 88px)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;background:repeating-linear-gradient(0deg,rgba(0,0,0,0.08) 0 1px,transparent 1px 3px);opacity:.3}
#verr{display:none;position:fixed;top:0;left:0;right:0;z-index:50;background:var(--re);color:var(--tx);font-size:10px;text-align:center;padding:6px var(--s3);letter-spacing:var(--tr);font-weight:700}
#verr.show{display:block}
#goff{display:none;position:fixed;inset:0;z-index:20;background:rgba(3,8,13,0.92);flex-direction:column;align-items:center;justify-content:center;gap:var(--s4);padding:var(--s4)}
#goff.show{display:flex}
#goff .goi{font-size:1.4rem;font-weight:800;letter-spacing:var(--trw);color:var(--dm);text-transform:uppercase}
#goff .god{font-size:var(--sm);color:var(--dm);text-align:center;max-width:400px;line-height:1.6}
#goff .goc{font-size:var(--xs);padding:6px var(--s3);border-radius:var(--r);border:1px solid var(--c25);color:var(--cy);background:var(--c06);font-family:var(--fn);letter-spacing:var(--tr)}
#tp{display:flex;align-items:center;gap:var(--s4);padding:0 var(--s3);min-height:48px;border-bottom:var(--ed);background:linear-gradient(180deg,var(--bp),var(--bp2));box-shadow:0 1px 0 var(--c10);z-index:5;flex-shrink:0}
.wm{display:flex;align-items:center;gap:var(--s2);font-size:1rem;font-weight:700;letter-spacing:var(--trw)}.wm .mk{width:20px;height:20px;color:var(--cyh)}.wm sp{color:var(--cyh);font-weight:300;margin-left:var(--s1);cursor:pointer}
.wm sp:hover{color:var(--tx)}
#lw{display:flex;align-items:center;gap:var(--s2);font-size:var(--xs);letter-spacing:var(--trw);font-weight:700}
#ld{width:8px;height:8px;border-radius:50%;display:inline-block}
#ld.on{background:var(--gdh);box-shadow:0 0 8px var(--gdh),0 0 18px var(--g45);animation:lp 2s ease-in-out infinite}
#ld.off{background:var(--re);opacity:.55}
#rt{margin-left:auto;display:flex;align-items:center;gap:var(--s4);font-size:var(--sm);letter-spacing:var(--tr);color:var(--dm)}
#rt .toc{font-size:var(--xs);display:flex;gap:var(--s3)}
#rt .toc .tolo{color:var(--cy)}#rt .toc .toloIn{color:var(--vi)}
#rt .fleet-btn{background:none;border:1px solid var(--c25);color:var(--cy);padding:2px 8px;border-radius:var(--r);cursor:pointer;font-family:var(--fn);font-size:9px;letter-spacing:var(--trw);text-transform:uppercase}
#rt .fleet-btn:hover{border-color:var(--c45);color:var(--cyh)}
#main{flex:1;display:flex;min-height:0;position:relative;z-index:1}
#graphWrap{flex:1;position:relative;min-height:0;overflow:hidden}
#gs{width:100%;height:100%;display:block}
.ansi{position:absolute;display:flex;flex-direction:column;gap:var(--s1);padding:var(--s3);pointer-events:none;z-index:2}
.ansi.tl{top:var(--s2);left:var(--s2)}.ansi.tr{top:var(--s2);right:var(--s2);text-align:right;align-items:flex-end}
.ansi.bl{bottom:var(--s2);left:var(--s2)}.ansi.br{bottom:var(--s2);right:var(--s2);text-align:right;align-items:flex-end}
.ansi.bt{bottom:var(--s2);left:50%;transform:translateX(-50%);text-align:center;align-items:center}
.ansi .als{font-size:var(--xs);font-weight:700;letter-spacing:var(--trw);color:var(--dm);white-space:nowrap}
.ansi .alb{font-size:var(--sm);text-shadow:0 0 8px var(--c16);white-space:nowrap}
#sd{width:260px;min-width:200px;display:flex;flex-direction:column;gap:0;border-left:var(--ed);overflow-y:auto;z-index:2;background:var(--bp);flex-shrink:0}
#sd>div{padding:var(--s2) var(--s3)}.sh{font-size:10px;font-weight:700;letter-spacing:var(--trw);text-transform:uppercase;color:var(--cy);cursor:pointer;padding:var(--s2) var(--s3);border-bottom:var(--ed);user-select:none;display:flex;align-items:center;gap:var(--s2)}
.sh .tk{color:var(--dm)}.sh .sc{color:var(--dm);margin-left:auto;font-size:9px}
#cm{flex:1;min-height:0;overflow-y:auto;max-height:300px}
.cr2{display:flex;align-items:center;gap:var(--s2);padding:2px var(--s3);font-size:8px;border-bottom:1px solid var(--c06)}
.cr2 .ct{color:var(--dm);min-width:36px;font-size:8px}.cr2 .cs{color:var(--cy);font-weight:500;min-width:30px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr2 .cm2{flex:1;color:var(--dm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tk{display:flex;flex-direction:column;gap:1px;padding:var(--s2) var(--s3)!important;max-height:150px;overflow-y:auto}
.tkc{display:flex;align-items:center;gap:var(--s2);padding:2px var(--s2);font-size:8px;border-radius:var(--r);border:1px solid var(--c16)}
.tkc .tks{font-size:7px;padding:1px 3px;border-radius:2px;letter-spacing:var(--tr);font-weight:700}
.tkc .tks.cp{color:var(--vi);border-color:var(--v25);background:var(--v12)}
.tkc .tkp{color:var(--dm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
#ss{display:flex;flex-direction:column;gap:1px;max-height:80px;overflow-y:auto;padding:var(--s2) var(--s3)!important}
.sr2{display:flex;align-items:center;gap:var(--s2);padding:2px var(--s2);font-size:8px;border-bottom:1px solid var(--c06)}
.sr2 .sa{color:var(--cy);font-weight:500;width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr2 .sk{font-size:7px;padding:1px 3px;border-radius:2px;border:1px solid var(--c25)}
.sr2 .sk.sd{color:var(--gn);border-color:var(--gr40);background:var(--gr12)}
.sr2 .sk.sg{color:var(--vi);border-color:var(--v25);background:var(--v12)}
.sr2 .sk.ss{color:var(--gdh);border-color:var(--g45);background:var(--g10)}
.sr2 .st2{color:var(--dm);margin-left:auto}
/* Fleet page */
#fleetPage{position:absolute;inset:0;z-index:10;background:rgba(3,8,13,0.97);display:none;flex-direction:column;overflow-y:auto}
#fleetPage.show{display:flex}
.fp-header{display:flex;align-items:center;justify-content:space-between;padding:var(--s3) var(--s4);border-bottom:var(--ed);background:var(--bp);flex-shrink:0}
.fp-header h2{font-size:1rem;font-weight:700;letter-spacing:var(--trw);color:var(--cyh)}
.fp-close{background:none;border:1px solid var(--c25);color:var(--dm);font-size:var(--sm);padding:4px 10px;border-radius:var(--r);cursor:pointer;font-family:var(--fn)}
.fp-close:hover{color:var(--tx);border-color:var(--c45)}
.fp-section{padding:var(--s4);border-bottom:1px solid var(--c10)}
.fp-role{display:flex;align-items:center;gap:var(--s2);font-size:var(--sm);font-weight:700;letter-spacing:var(--trw);text-transform:uppercase;padding-bottom:var(--s3);margin-bottom:var(--s2)}
.fp-role .role-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.fp-card{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s3);border-radius:var(--r);border:1px solid var(--c16);margin-bottom:1px}
.fp-card .fp-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fp-card .fp-icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5}
.fp-card .fp-name{flex:1;font-size:var(--sm);font-weight:500;letter-spacing:var(--tr);color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fp-card .fp-model{font-size:9px;padding:1px 4px;border-radius:2px;border:1px solid var(--c25);color:var(--dm);flex-shrink:0}
.fp-card .fp-status{font-size:8px;padding:2px 5px;border-radius:2px;letter-spacing:var(--tr);font-weight:700;flex-shrink:0}
.fp-card .fp-sessions{font-size:9px;color:var(--dm);flex-shrink:0;min-width:40px;text-align:right}
.fp-card .fp-tokens{font-size:9px;color:var(--dm);flex-shrink:0;min-width:60px;text-align:right}
@keyframes lp{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.82)}}
</style>
</head>
<body>
<div id="verr"></div>
<div id="goff">
  <div class="goi">GATEWAY OFFLINE</div>
  <div class="god">The OpenClaw gateway is not running. Restart it to see live agent data.</div>
  <div class="goc">openclaw gateway restart</div>
</div>
<header id="tp">
<div class="wm"><svg class="mk" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.2"/><line x1="12" y1="1" x2="12" y2="5" stroke="currentColor" stroke-width="1.2"/><line x1="12" y1="19" x2="12" y2="23" stroke="currentColor" stroke-width="1.2"/><line x1="1" y1="12" x2="5" y2="12" stroke="currentColor" stroke-width="1.2"/><line x1="19" y1="12" x2="23" y2="12" stroke="currentColor" stroke-width="1.2"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/></svg>DISPATCH<sp id="fleetBtn">FLEET</sp></div>
<div id="lw"><span id="ld" class="off"></span><span id="ll">OFFLINE</span></div>
<div id="rt"><span id="rti">-</span><span class="toc" id="toc">I:<span class="toloIn" id="ti">-</span> O:<span class="tolo" id="to">-</span></span></div>
</header>
<main id="main">
<div id="graphWrap" class="panel">
<canvas id="gs"></canvas>
<div class="ansi tl"><span class="als">AGENTS ONLINE</span><span class="alb" id="tAg">-</span></div>
<div class="ansi tr"><span class="als">AGENTS RUNNING</span><span class="alb lt" id="tWk">-</span></div>
<div class="ansi bl"><span class="als">SESSIONS</span><span class="alb" id="tSe">-</span></div>
<div class="ansi bt"><span class="als">TOKENS TODAY</span><span class="alb" id="tTo">In <span id="ti2">-</span> / Out <span id="to2">-</span></span></div>
</div>
<div id="sd">
<div class="sh"><span class="tk">//</span>COMMS</div>
<div id="cm">Loading</div>
<div class="sh"><span class="tk">//</span>TASKS</div>
<div id="tk"></div>
<details open><summary class="sh"><span class="tk">//</span>SESSIONS</summary><div id="ss"></div></details>
</div>
<div id="fleetPage"></div>
</main>
<script>
var A={main:'operator',devLead:'producer',devops:'producer',writer:'producer',editor:'maintainer',philosopher:'critic','art-director':'producer','creative-reviewer':'critic','security-reviewer':'critic','tax-assistant':'producer','tax-reviewer':'critic','ux-researcher':'producer','pm-impact-analyst':'producer','dispatch':'operator'};
var ROLE_CLR={operator:[245,179,1],producer:[34,211,238],critic:[177,123,255],maintainer:[47,214,123]};
var ROLE_LABEL={producer:'PRODUCERS',critic:'CRITICS',maintainer:'MAINTAINERS',operator:'ORCHESTRATOR'};
var ICONS={}; // set by agent-specific icons below
var ANG={'producer':[300,60],operator:275,critic:[120,220],maintainer:[230,290]};
var DIST={'producer':[240,340],operator:220,critic:[240,340],maintainer:[200,280]};
var canvas=document.getElementById('gs'),ctx=canvas.getContext('2d');
var W=0,H=0,CX=0,CY=0,CR=0,agents=[],sessions=[],comms=[];
var pos=new Map(),aStatus=new Map(),agentsMap=new Map();
var dataReady=false,anim=0,visible=true,rafId=null;

document.addEventListener('visibilitychange',function(){visible=!document.hidden;if(visible&&!rafId)rafId=requestAnimationFrame(renderFrame)});

function hexPts(cx,cy,r){var p=[];for(var i=0;i<6;i++){var a=i*60*Math.PI/180;p.push({x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r})}return p}
function drawHex(cx,cy,r,fill,stroke,sw){var pts=hexPts(cx,cy,r);ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(var i=1;i<6;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=sw||1;ctx.stroke()}}
function hsh(n){var h=2166136261;for(var i=0;i<n.length;i++){h^=n.charCodeAt(i);h=Math.imul(h,16777619)}return((h>>>0)%100000)/100000}
function resize(){var w=document.getElementById('graphWrap');W=w.clientWidth;H=w.clientHeight;canvas.width=W;canvas.height=H;CX=W/2;CY=H/2;CR=Math.min(W,H)/22;if(CR<20)CR=20;if(CR>50)CR=50}
window.addEventListener('resize',resize);resize();
function fmt(n){if(typeof n!=='number'||n<0)return'-';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'k';return n+''}
function ago(ts){if(typeof ts!=='number')return'-';var s=Math.floor((Date.now()-ts)/1000);if(s<60)return s+'s ago';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago'}

function calcPos(){pos.clear();if(!agents.length)return;var grp={producer:[],operator:[],critic:[],maintainer:[]};agents.forEach(function(a){var r=A[a.id]||'maintainer';if(a.id&&a.id!=='dispatch'&&grp[r])grp[r].push(a)});Object.keys(grp).forEach(function(role){var ms=grp[role],ang=ANG[role],ds=DIST[role];if(!ang||!ms)return;var aa=Array.isArray(ang)?ang:[ang],dd=Array.isArray(ds)?ds:[ds];ms.forEach(function(a,i){var f=ms.length>1?i/(ms.length-1):0.5;var deg=aa[0]+(aa[1]-aa[0])*f,di=dd[0]+(dd.length>1?(dd[1]-dd[0])*f:0);var jt=(hsh(a.id+'j')-0.5)*30,rd=(deg-90)*Math.PI/180;pos.set(a.id,{x:CX+Math.cos(rd)*(di+jt),y:CY+Math.sin(rd)*(di+jt)})})})}

function drawGrid(){ctx.save();ctx.globalAlpha=0.1;for(var r=CR*2;r<Math.min(W,H)/2;r+=45){ctx.beginPath();ctx.arc(CX,CY,r,0,Math.PI*2);ctx.strokeStyle='rgba(34,211,238,0.25)';ctx.lineWidth=0.5;ctx.setLineDash([2,5]);ctx.stroke();ctx.setLineDash([])}ctx.restore()}
function drawCore(){var pulse=1+Math.sin(anim*2)*0.03;for(var i=3;i>=1;i--)drawHex(CX,CY,CR*i*0.5*pulse,'none','rgba(34,211,238,'+(0.12/i)+')',0.5);drawHex(CX,CY,CR*0.45,'rgba(245,179,1,0.08)','rgba(245,179,1,0.5)',1.2);ctx.save();ctx.beginPath();ctx.arc(CX,CY,CR*0.4,0,Math.PI*2);ctx.strokeStyle='rgba(245,179,1,0.25)';ctx.lineWidth=1;ctx.setLineDash([4,3]);ctx.stroke();ctx.setLineDash([]);ctx.restore()}
function drawEdges(){pos.forEach(function(p,id){var st=aStatus.get(id);ctx.save();ctx.beginPath();ctx.moveTo(CX,CY);ctx.lineTo(p.x,p.y);if(st==='active'){ctx.strokeStyle='rgba(245,179,1,0.2)';ctx.lineWidth=1.5;ctx.setLineDash([6,6])}else{ctx.strokeStyle='rgba(34,211,238,0.08)';ctx.lineWidth=0.6;ctx.setLineDash([3,6])}ctx.stroke();ctx.setLineDash([]);ctx.restore()})}
function drawNodes(){pos.forEach(function(p,id){var st=aStatus.get(id)||'idle',isAct=st==='active',isCmp=st==='completed',isRct=st==='recent';var a=agentsMap.get(id);var role=A[id]||'maintainer';var clr=ROLE_CLR[role]||[34,211,238];var pulse=isAct?1+Math.sin(anim*4)*0.06:isRct?1+Math.sin(anim*2.5)*0.03:1;var r=18*pulse;ctx.save();if(isAct){ctx.shadowColor='rgba('+clr[0]+','+clr[1]+','+clr[2]+',0.5)';ctx.shadowBlur=12+Math.sin(anim*3)*4}else if(isCmp){ctx.shadowColor='rgba('+clr[0]+','+clr[1]+','+clr[2]+',0.3)';ctx.shadowBlur=6}drawHex(p.x,p.y,r,'rgba('+clr[0]+','+clr[1]+','+clr[2]+',0.08)','rgba('+clr[0]+','+clr[1]+','+clr[2]+',0.6)',isAct?1.5:1);ctx.restore();ctx.save();ctx.beginPath();ctx.arc(p.x,p.y-2,3,0,Math.PI*2);ctx.fillStyle='rgba('+clr[0]+','+clr[1]+','+clr[2]+',0.7)';ctx.fill();ctx.restore();var name=(a?a.name||a.id:id).substring(0,12);ctx.save();ctx.fillStyle='rgba('+clr[0]+','+clr[1]+','+clr[2]+',0.9)';ctx.font='500 9px IBM Plex Mono,monospace';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(name,p.x,p.y+r+5);ctx.restore()})}
function drawLabels(){ctx.save();ctx.font='700 9px IBM Plex Mono,monospace';ctx.textAlign='center';ctx.fillStyle='rgba(91,122,138,0.5)';var grp={};agents.filter(function(a){return a.id&&a.id!=='dispatch'}).forEach(function(a){var r=A[a.id]||'maintainer';if(!grp[r])grp[r]=[];grp[r].push(a)});Object.keys(ROLE_LABEL).forEach(function(role){var ms=grp[role];if(!ms||!ms.length)return;var p=pos.get(ms[Math.floor(ms.length/2)].id);if(!p)return;var ag=Array.isArray(ANG[role])?ANG[role]:[ANG[role],ANG[role]];var midDeg=(ag[0]+ag[1])/2,midRad=(midDeg-90)*Math.PI/180;var dd=Array.isArray(DIST[role])?DIST[role]:[DIST[role]];var lr=dd[0]+70;var lx=CX+Math.cos(midRad)*lr,ly=CY+Math.sin(midRad)*lr;ctx.fillText(ROLE_LABEL[role],lx,ly)});ctx.restore()}
function renderFrame(t){rafId=null;if(!visible)return;anim=t*0.001;ctx.clearRect(0,0,W,H);drawGrid();drawCore();if(!dataReady){ctx.save();ctx.fillStyle='#5b7a8a';ctx.font='14px IBM Plex Mono,monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('Waiting for data...',CX,CY);ctx.restore();rafId=requestAnimationFrame(renderFrame);return}drawEdges();drawNodes();drawLabels();rafId=requestAnimationFrame(renderFrame)}
function renderUI(data){try{var a=data.agents,s=data.sessions,c=data.comms,ts=data.now;agents=a||[];sessions=s||[];comms=c||[];var now=Date.now();var live=ts&&(now-ts)<15000;document.getElementById('ld').className=live?'on':'off';document.getElementById('ll').textContent=live?'LIVE':'OFFLINE';document.getElementById('ll').style.color=live?'var(--gdh)':'var(--dm)';document.getElementById('rti').textContent=agents.length+' agents';var wk=new Set(s.filter(function(x){return x.updatedAt&&(now-x.updatedAt)<120000}).map(function(x){return x.agentId}));document.getElementById('tAg').textContent=agents.length;document.getElementById('tWk').textContent=wk.size;document.getElementById('tSe').textContent=s.length;var totIn=s.reduce(function(x,ss){return x+(ss.inputTokens||0)},0);var totOut=s.reduce(function(x,ss){return x+(ss.outputTokens||0)},0);document.getElementById('tTo').textContent='In '+fmt(totIn)+' / Out '+fmt(totOut);document.getElementById('ti').textContent=fmt(totIn);document.getElementById('to').textContent=fmt(totOut);document.getElementById('ti2').textContent=fmt(totIn);document.getElementById('to2').textContent=fmt(totOut);agentsMap.clear();agents.forEach(function(x){agentsMap.set(x.id,x)});aStatus.clear();var act=new Set(s.filter(function(x){return x.updatedAt&&(now-x.updatedAt)<60000}).map(function(x){return x.agentId}));var rct=new Set(s.filter(function(x){return x.updatedAt&&(now-x.updatedAt)<300000&&(now-x.updatedAt)>=60000}).map(function(x){return x.agentId}));agents.forEach(function(x){if(act.has(x.id)){aStatus.set(x.id,'active')}else if(rct.has(x.id)){aStatus.set(x.id,'recent')}else{aStatus.set(x.id,'idle')}});calcPos();dataReady=true;document.getElementById('cm').innerHTML=c&&c.length?c.slice().sort(function(a,b){return b.time-a.time}).slice(0,25).map(function(x){return '<div class="cr2"><span class="ct">'+ago(x.time)+'</span><span class="cs">'+x.from+'</span><span class="cm2">'+(x.msg||'')+'</span></div>'}).join(''):'<div style="color:var(--dm);padding:12px">No comms</div>';document.getElementById('tk').innerHTML=s&&s.length?s.slice(0,12).map(function(t){var sc='cp';if(t.updatedAt&&(now-t.updatedAt)<120000)sc='rn';return '<div class="tkc"><span class="tks '+sc+'">'+(now-t.updatedAt<120000?'RUNNING':'OK')+'</span><span class="tka">'+t.agentId+'</span></div>'}).join(''):'<div style="color:var(--dm);padding:8px">No tasks</div>';function getRank(v){if(v>2000)return'ss';if(v>1000)return'sg';return'sd'}document.getElementById('ss').innerHTML=s&&s.length?s.slice(0,15).map(function(x){return '<div class="sr2"><span class="sa">'+x.agentId+'</span><span class="sk '+getRank(x.totalTokens)+'">'+fmt(x.totalTokens)+'</span><span class="st2">'+ago(x.updatedAt)+'</span></div>'}).join(''):'<div style="color:var(--dm);padding:8px">None</div>';renderFleet()}catch(e){console.log('HUD error:',e)}}
function renderFleet(){var roles={producer:{label:'PRODUCERS',clr:'var(--cy)',dot:'var(--cy)'},critic:{label:'CRITICS',clr:'var(--vi)',dot:'var(--vi)'},maintainer:{label:'MAINTAINERS',clr:'var(--gn)',dot:'var(--gn)'},operator:{label:'ORCHESTRATOR',clr:'var(--gdh)',dot:'var(--gdh)'}};var grp={};agents.forEach(function(a){var r=A[a.id]||'maintainer';if(!grp[r])grp[r]=[];grp[r].push(a)});var html='<div class="fp-header"><h2>// FLEET</h2><button class="fp-close" onclick="document.getElementById(\'fleetPage\').classList.remove(\'show\')">CLOSE</button></div>';Object.keys(roles).forEach(function(role){var ms=grp[role];if(!ms||!ms.length)return;var r=roles[role];html+='<div class="fp-section"><div class="fp-role"><span class="role-dot" style="background:'+r.dot+'"></span>'+r.label+'<span style="color:var(--dm);font-size:10px;font-weight:400;margin-left:auto">'+ms.length+'</span></div>';ms.forEach(function(a){var st=aStatus.get(a.id)||'idle',isAct=st==='active';var stClr=isAct?'var(--gdh)':'var(--dm)';var stLbl=isAct?'ACTIVE':'IDLE';var agentSessions=sessions.filter(function(s){return s.agentId===a.id});var sesCount=agentSessions.length;var totIn=agentSessions.reduce(function(x,ss){return x+(ss.inputTokens||0)},0);var totOut=agentSessions.reduce(function(x,ss){return x+(ss.outputTokens||0)},0);html+='<div class="fp-card" style="border-left:3px solid '+r.dot+'"><div class="fp-icon" style="color:'+r.clr+'">'+renderIcon(a.id)+'</div><span class="fp-name">'+(a.name||a.id)+'</span><span class="fp-model">'+(a.model?a.model.split('/').pop():'')+'</span><span class="fp-status" style="color:'+stClr+'">'+stLbl+'</span><span class="fp-sessions">'+sesCount+' ses</span><span class="fp-tokens">I:'+fmt(totIn)+' O:'+fmt(totOut)+'</span></div>'});html+='</div>'});document.getElementById('fleetPage').innerHTML=html}
function renderIcon(id){var svgs={dispatch:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="12" y1="6" x2="12" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="12" y1="12" x2="7" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',main:'<svg viewBox="0 0 24 24"><rect x="7" y="4" width="10" height="16" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="12" y1="8" x2="12" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="12" cy="14" r="1" fill="currentColor"/></svg>','dev-lead':'<svg viewBox="0 0 24 24"><path d="M5 20l4-4m-4 4l-2-3m2 3l3-2m4-4l4-4m-4 4l-2-3m2 3l3 2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="16" cy="6" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',devops:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',writer:'<svg viewBox="0 0 24 24"><path d="M4 20l4-4 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="12" y1="4" x2="12" y2="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',editor:'<svg viewBox="0 0 24 24"><path d="M16 4l4 4-8 8H8v-4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',philosopher:'<svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 20c2-4 14-4 14 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>','art-director':'<svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="9" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M14 12l3-3v6z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>','creative-reviewer':'<svg viewBox="0 0 24 24"><path d="M12 4v16M20 12H4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>','security-reviewer':'<svg viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>','tax-assistant':'<svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="9" y1="8" x2="15" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="9" y1="12" x2="15" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="9" y1="16" x2="13" y2="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>','tax-reviewer':'<svg viewBox="0 0 24 24"><path d="M4 20l4-4m-4 4l3 1m-3-1l1-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><rect x="10" y="3" width="10" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>','ux-researcher':'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="12" y1="5" x2="12" y2="2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="12" y1="22" x2="12" y2="19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="5" y1="12" x2="2" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="22" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>','pm-impact-analyst':'<svg viewBox="0 0 24 24"><path d="M4 20h16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M6 20V8l4 4 4-6 4 6 4-4v12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>'};return svgs[id]||'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>'}
rafId=requestAnimationFrame(renderFrame);
var es=new EventSource('/stream');
es.addEventListener('state',function(e){try{var d=JSON.parse(e.data);renderUI(d)}catch(x){}});
es.addEventListener('session-update',function(e){try{var d=JSON.parse(e.data);if(d.changed)d.changed.forEach(function(s){var idx=sessions.findIndex(function(x){return x.key===s.key});if(idx>=0)sessions[idx]=s;else sessions.push(s)});if(d.removed)d.removed.forEach(function(k){var idx=sessions.findIndex(function(x){return x.key===k});if(idx>=0)sessions.splice(idx,1)});renderUI({agents:agents,sessions:sessions,comms:comms,now:d.now})}catch(x){}});
es.addEventListener('gateway-offline',function(){document.getElementById('goff').classList.add('show')});
es.addEventListener('version',function(e){try{var d=JSON.parse(e.data);document.getElementById('rti').textContent=d.version+' | '+agents.length+' agents'}catch(x){}});
es.addEventListener('format-error',function(e){try{var d=JSON.parse(e.data);var verr=document.getElementById('verr');verr.textContent='OpenClaw version mismatch: HUD needs to be updated for the new format';verr.classList.add('show')}catch(x){}});
